name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-master
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm tauri build --no-bundle
        working-directory: ui
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/engram-notes-x86_64-unknown-linux-gnu.tar.gz -C target/release engram-notes
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*

  windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm tauri build --no-bundle
        working-directory: ui
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/engram-notes.exe `
            -DestinationPath dist/engram-notes-x86_64-pc-windows-msvc.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  # One rolling prerelease holding every platform, so the installer has a URL
  # that does not move. Recreated rather than edited: the tag follows master.
  publish:
    name: publish the rolling latest release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          for f in *.tar.gz *.zip; do sha256sum "$f" > "$f.sha256"; done
          ls -l
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Built from \`${GITHUB_SHA:0:7}\` on $(date -u +%Y-%m-%dT%H:%MZ).
          The \`latest\` tag moves with every commit to master; it is not a release.

          **Linux** needs webkit2gtk 4.1 and GTK 3 at runtime:

              curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/master/install.sh | sh

          **Windows**: download the .zip below and run \`engram-notes.exe\`. Unsigned, so SmartScreen will warn.
          EOF

          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "engram-notes (latest master)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*
