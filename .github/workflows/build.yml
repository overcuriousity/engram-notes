name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-master
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Fetch the models
        shell: bash
        run: scripts/fetch-models.sh
      # tauri-bundler fetches linuxdeploy and AppRun on first use with a single
      # unretried request, so one 504 from github.com loses the whole build. It
      # skips any tool already in its cache, so seed them with a curl that
      # retries. The AppImage plugin is the one the bundler treats as optional.
      - name: Seed the bundler's tools
        run: |
          tools="$HOME/.cache/tauri"
          mkdir -p "$tools"
          fetch() {
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
                 -o "$tools/$1.part" "$2"; then
              chmod +x "$tools/$1.part"
              mv "$tools/$1.part" "$tools/$1"
            else
              rm -f "$tools/$1.part"
              return 1
            fi
          }
          releases=https://github.com/tauri-apps/binary-releases/releases/download
          plugins=https://raw.githubusercontent.com/tauri-apps
          fetch AppRun-x86_64 "$releases/apprun-old/AppRun-x86_64"
          fetch linuxdeploy-x86_64.AppImage "$releases/linuxdeploy/linuxdeploy-x86_64.AppImage"
          fetch linuxdeploy-plugin-gtk.sh "$plugins/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          fetch linuxdeploy-plugin-gstreamer.sh "$plugins/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh"
          fetch linuxdeploy-plugin-appimage.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage \
            || echo "AppImage plugin unseeded; linuxdeploy falls back to its built-in one"
      - run: pnpm tauri build --bundles appimage
        working-directory: ui
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
      # The AppImage carries WebKitGTK; the tarball is the slim build for
      # machines that already have it.
      #
      # Tauri's GTK plugin bundles libwayland, which the AppImage excludelist
      # forbids: the host's Mesa already links the host's copy, and a second
      # one in the process makes eglGetDisplay fail with EGL_BAD_PARAMETER on
      # any Wayland session. Unpack, drop them, repack.
      - name: Package
        run: |
          mkdir -p dist
          cd target/release/bundle/appimage
          for f in *.AppImage; do APPIMAGE_EXTRACT_AND_RUN=1 "./$f" --appimage-extract >/dev/null; done
          rm -f squashfs-root/usr/lib/libwayland-client.so.0 \
                squashfs-root/usr/lib/libwayland-egl.so.1 \
                squashfs-root/usr/lib/libwayland-cursor.so.0 \
                squashfs-root/usr/lib/libwayland-server.so.0
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" squashfs-root \
            "$GITHUB_WORKSPACE/dist/engram-notes-x86_64.AppImage"
          cd "$GITHUB_WORKSPACE"
          # A bare binary looks for its models in ../lib/engram-notes beside
          # its bin/, so the slim tarball is that folder pair.
          stage=$RUNNER_TEMP/slim
          mkdir -p "$stage/bin" "$stage/lib/engram-notes"
          cp target/release/engram-notes "$stage/bin/"
          cp -r target/release/models "$stage/lib/engram-notes/"
          tar -czf dist/engram-notes-x86_64-unknown-linux-gnu.tar.gz -C "$stage" bin lib
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*

  windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Fetch the models
        shell: bash
        run: scripts/fetch-models.sh
      - run: pnpm tauri build --no-bundle
        working-directory: ui
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/engram-notes.exe, target/release/models `
            -DestinationPath dist/engram-notes-x86_64-pc-windows-msvc.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  # One rolling prerelease holding every platform, so the installer has a URL
  # that does not move. Recreated rather than edited: the tag follows master.
  publish:
    name: publish the rolling latest release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          for f in *.AppImage *.tar.gz *.zip; do sha256sum "$f" > "$f.sha256"; done
          ls -l
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Built from \`${GITHUB_SHA:0:7}\` on $(date -u +%Y-%m-%dT%H:%MZ).
          The \`latest\` tag moves with every commit to master; it is not a release.

          **Linux**: the AppImage carries WebKitGTK and runs on its own. Needs glibc 2.39 or newer.

              curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/master/install.sh | sh

          The .tar.gz is the slim build for machines that already have webkit2gtk 4.1 and GTK 3: unpack it and keep bin/ and lib/ together.

          **Windows**: download the .zip below, unpack it whole and run \`engram-notes.exe\` beside its \`models\` folder. Unsigned, so SmartScreen will warn.
          EOF

          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "engram-notes (latest master)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*
